openapi: 3.0.3
info:
  title: QR Reward Platform API
  version: '1.0'
  description: |
    Promoters fund QR campaigns; end users scan and sign up with a publisher; coins move
    automatically, exactly once. See `SYSTEM_FLOW.md` for the end-to-end narrative behind
    these endpoints and the invariants each one enforces.

    ### Auth schemes
    - **sessionAuth** — `Authorization: Bearer <jwt>` from `/v1/auth/login` or `/v1/auth/signup`.
      12h expiry. Used by promoter/publisher portal routes and the admin console.
    - **apiKeyAuth** — `Authorization: Bearer pk_<hex>` issued once at publisher signup (or via
      rotate). Used only by the publisher's own server, never a browser.
    - Unauthenticated routes: `/healthz`, `GET /r/:code`, `GET /v1/qr-codes/:id/image`,
      `POST /v1/auth/signup`, `POST /v1/auth/login`.
servers:
  - url: http://localhost:4000
    description: Local dev
  - url: '{baseUrl}'
    description: Deployed
    variables:
      baseUrl:
        default: https://api.example.com

security: []

tags:
  - name: Auth
    description: Account creation and session login. No auth required.
  - name: Public
    description: The scan hot path, health check, and QR image render. No auth required.
  - name: Portal
    description: Promoter/publisher dashboard — partnerships, campaigns, QR codes, org settings.
  - name: Partner API
    description: Called by the publisher's own server with its `pk_...` API key. Never a browser.
  - name: Admin
    description: Super admin console. Cross-tenant reads and overrides, all audited.

paths:
  # ---------------- Auth ----------------
  /v1/auth/signup:
    post:
      tags: [Auth]
      summary: Create an org (promoter or publisher) and start a session
      description: |
        Publisher signup also mints a Partner API key, returned once as `api_key` and stored
        only as a SHA-256 hash. Rate limited to 10/min per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, type]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                type: { type: string, enum: [promoter, publisher] }
                landing_url:
                  type: string
                  description: Publisher only — where scans redirect to. https only (http for localhost).
      responses:
        '201':
          description: Org created, session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: Session JWT, 12h expiry }
                  org: { $ref: '#/components/schemas/OrgSummary' }
                  api_key:
                    type: string
                    nullable: true
                    description: Publisher only — shown once, never retrievable again
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in and start a session
      description: |
        Rate limited per IP (20/min) and per account (10/min) — one bucket stops credential
        stuffing, the other stops a distributed brute force against a single account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  org: { $ref: '#/components/schemas/OrgSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------- Public ----------------
  /healthz:
    get:
      tags: [Public]
      summary: Liveness/readiness probe
      description: Hits Postgres on purpose — a process that can't reach the DB should be pulled from rotation.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, example: ok } }
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, example: db_unavailable } }

  /r/{code}:
    get:
      tags: [Public]
      summary: Scan a QR code — the hot path
      description: |
        Rate limited 30/min per IP. Fails closed: any unclear state redirects to
        `/campaign-ended?reason=<reason>` on the frontend instead of erroring. On success,
        redirects to the publisher's landing URL with a 15-minute single-use `?st=<scan_token>`.

        Reasons: `rate_limited`, `invalid`, `voided`, `paused`, `ended`, `budget`, `expired`, `used_up`.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirect to the publisher landing page (success) or `/campaign-ended?reason=...` (turned away)

  /v1/qr-codes/{id}/image:
    get:
      tags: [Public]
      summary: Render a QR code as SVG or PNG
      description: |
        Unauthenticated — the QR only encodes a public scan URL. Rate limited 120/min per IP.
        Supports a live style preview via the `style` query param before the code is saved.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: format
          in: query
          schema: { type: string, enum: [svg, png], default: svg }
        - name: style
          in: query
          description: JSON-encoded QrStyle override, for live preview
          schema: { type: string }
      responses:
        '200':
          description: Image
          content:
            image/svg+xml: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- Portal ----------------
  /v1/publishers:
    get:
      tags: [Portal]
      summary: List publishers (for choosing a partnership target)
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties: { id: { type: string, format: uuid }, name: { type: string } }

  /v1/partnerships:
    post:
      tags: [Portal]
      summary: Request a partnership with a publisher
      description: Promoter only. Sets the commercial terms for every campaign under it.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publisher_org_id]
              properties:
                publisher_org_id: { type: string, format: uuid }
                coin_rate: { type: integer, minimum: 1, maximum: 100000, default: 50 }
                guest_rate: { type: integer, minimum: 0, description: 'Must be <= coin_rate', default: 10 }
                grace_days: { type: integer, minimum: 0, maximum: 365, default: 7 }
      responses:
        '201':
          description: Partnership created with status `pending`
          content: { application/json: { schema: { $ref: '#/components/schemas/Partnership' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Portal]
      summary: List partnerships involving my org
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Partnership' } }

  /v1/partnerships/{id}/accept:
    post:
      tags: [Portal]
      summary: Accept a pending partnership request
      description: Publisher only, and only the publisher named on that partnership.
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Partnership now `active`
          content: { application/json: { schema: { $ref: '#/components/schemas/Partnership' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/campaigns:
    post:
      tags: [Portal]
      summary: Create a campaign under an active partnership
      description: Promoter only.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partnership_id, name]
              properties:
                partnership_id: { type: string, format: uuid }
                name: { type: string }
      responses:
        '201':
          description: Campaign created with status `active` and zero budget
          content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [Portal]
      summary: List campaigns visible to my org
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Campaign' } }

  /v1/campaigns/{id}/fund:
    post:
      tags: [Portal]
      summary: Fund a campaign's budget
      description: |
        Promoter only, owner of the campaign. Demo funding credits the ledger directly
        (`external:funding` → `campaign:{id}`); production would put a PSP checkout in front.
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coins]
              properties: { coins: { type: integer, minimum: 1, maximum: 10000000 } }
      responses:
        '201':
          description: New budget
          content:
            application/json:
              schema: { type: object, properties: { budget: { type: integer } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/campaigns/{id}:
    patch:
      tags: [Portal]
      summary: Pause, resume, or end a campaign
      description: Promoter only, owner of the campaign.
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string, enum: [active, paused, ended] } }
      responses:
        '200':
          description: Updated campaign
          content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/campaigns/{id}/stats:
    get:
      tags: [Portal]
      summary: Campaign performance — scans, redemptions, coins granted, budget left
      description: Either party on the partnership may read.
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scans: { type: integer }
                  redemptions: { type: integer }
                  coins_granted: { type: integer }
                  budget_remaining: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/campaigns/{id}/qr-codes:
    post:
      tags: [Portal]
      summary: Create a QR code for a campaign
      description: Promoter only, owner of the campaign. Time-bound by default (30 days).
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                style: { $ref: '#/components/schemas/QrStyle' }
                expires_in_days:
                  type: integer
                  minimum: 0
                  maximum: 3650
                  default: 30
                  description: '0 = never expires'
                max_uses:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: 'Omit/null = unlimited'
      responses:
        '201':
          description: QR code created
          content: { application/json: { schema: { $ref: '#/components/schemas/QrCode' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [Portal]
      summary: List QR codes for a campaign
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/QrCode' } }

  /v1/qr-codes/{id}/void:
    post:
      tags: [Portal]
      summary: Void a QR code (lost/stolen print run)
      description: |
        Promoter only, owner of the code. Promoters may only tighten a code (void it), never
        loosen one — extending expiry or use limits is an admin-only override.
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Voided
          content: { application/json: { schema: { $ref: '#/components/schemas/QrCode' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/qr-codes/{id}:
    patch:
      tags: [Portal]
      summary: Restyle a QR code
      description: Promoter only, owner of the code. Cosmetic only — does not touch expiry or use limits.
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [style]
              properties: { style: { $ref: '#/components/schemas/QrStyle' } }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/QrCode' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/api-keys/rotate:
    post:
      tags: [Portal]
      summary: Rotate my Partner API key
      description: Publisher only. Old key is invalidated immediately; new key shown once.
      security: [{ sessionAuth: [] }]
      responses:
        '201':
          description: New key
          content:
            application/json:
              schema: { type: object, properties: { api_key: { type: string } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/orgs/me:
    get:
      tags: [Portal]
      summary: My org profile
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Org' } } }
    patch:
      tags: [Portal]
      summary: Update my landing URL
      description: Publisher setting — where scans redirect to. Validated https-only (http for localhost).
      security: [{ sessionAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { landing_url: { type: string } }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/OrgSummary' } } }

  /v1/redemptions:
    get:
      tags: [Portal]
      summary: My org's recent redemptions (portal view)
      description: Latest 100, either side of the partnership.
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Redemption' } }

  # ---------------- Partner API ----------------
  /v1/redemptions/verify:
    post:
      tags: [Partner API]
      summary: Grant a reward for a scanned-then-signed-up user
      description: |
        Called by the publisher's own server after a user signs up, carrying the scan token
        from the landing-page redirect. Pays `coin_rate` if `identified: true`, else
        `guest_rate` (the default) with the remainder held for `grace_days`. One redemption
        per `(campaign, publisher_user_ref)` — a second call for the same user conflicts.
      security: [{ apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scan_token, publisher_user_ref]
              properties:
                scan_token: { type: string, description: The `st` query param from the landing redirect }
                publisher_user_ref: { type: string, description: The publisher's own user id }
                identified:
                  type: boolean
                  default: false
                  description: Publisher's own verification bar cleared. Absent/false = guest tier.
      responses:
        '201':
          description: Reward granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  redemption_id: { type: string, format: uuid }
                  campaign_id: { type: string, format: uuid }
                  coins: { type: integer }
                  identified: { type: boolean }
                  status: { type: string, example: granted }
                  pending_coins: { type: integer, description: What upgrading later would still pay }
                  upgrade_deadline: { type: string, format: date-time, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: budget_exhausted | scan token already used | duplicate_user
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: scan token invalid/expired, or not a scan token
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/redemptions/{id}/upgrade:
    post:
      tags: [Partner API]
      summary: Release the held-back guest→verified delta
      description: |
        Idempotent — calling it twice on an already-upgraded redemption is a no-op
        (`status: already_full`). Refused once `grace_days` has elapsed since the original scan.
      security: [{ apiKeyAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Upgraded (or already full)
          content:
            application/json:
              schema:
                type: object
                properties:
                  redemption_id: { type: string, format: uuid }
                  coins: { type: integer }
                  coins_added: { type: integer }
                  identified: { type: boolean }
                  status: { type: string, enum: [upgraded, already_full] }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: budget_exhausted | grace_period_expired
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/redemptions/{id}:
    get:
      tags: [Partner API]
      summary: Look up a redemption
      security: [{ apiKeyAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Redemption' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- Admin ----------------
  /v1/admin/overview:
    get:
      tags: [Admin]
      summary: Platform-wide stats and ledger integrity check
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 17 aggregates plus `ledger_balanced` (true iff every ledger ref sums to zero) and `conversion_rate`

  /v1/admin/orgs:
    get:
      tags: [Admin]
      summary: List every org (search by name/email)
      security: [{ sessionAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminOrg' } }

  /v1/admin/orgs/{id}:
    patch:
      tags: [Admin]
      summary: Suspend/reinstate an org, or edit its name/landing URL
      description: Audited to `GET /v1/admin/audit-log` as `org.patch`.
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                suspended: { type: boolean }
                name: { type: string }
                landing_url: { type: string }
                reason: { type: string, description: Audit trail only }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/Org' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/orgs/{id}/rotate-key:
    post:
      tags: [Admin]
      summary: Rotate a publisher's API key on their behalf
      description: Support path — key leaked or lost. Audited as `org.rotate_key`.
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: New key, shown once
          content:
            application/json:
              schema: { type: object, properties: { api_key: { type: string } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/orgs/{id}/offboard:
    post:
      tags: [Admin]
      summary: Suspend an org, revoke its API key, and end every campaign it touches — in one action
      description: Audited as `org.offboard`.
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        '201':
          description: Offboarded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  type: { type: string }
                  campaigns_ended: { type: integer }
                  api_key_revoked: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/partnerships:
    get:
      tags: [Admin]
      summary: List every partnership across all tenants
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Partnership' } }

  /v1/admin/partnerships/{id}:
    patch:
      tags: [Admin]
      summary: Override a partnership's rates or status
      description: Audited as `partnership.patch`. `guest_rate` may never exceed `coin_rate`.
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                coin_rate: { type: integer, minimum: 1, maximum: 100000 }
                guest_rate: { type: integer, minimum: 0 }
                grace_days: { type: integer, minimum: 0, maximum: 365 }
                status: { type: string, enum: [pending, active] }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/Partnership' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/campaigns:
    get:
      tags: [Admin]
      summary: List every campaign across all tenants
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Campaign' } }

  /v1/admin/campaigns/{id}:
    patch:
      tags: [Admin]
      summary: Override a campaign's status
      description: Audited as `campaign.patch`.
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, paused, ended] }
                reason: { type: string }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/campaigns/{id}/kill:
    post:
      tags: [Admin]
      summary: End a campaign and void every code it ever issued, in one action
      description: Audited as `campaign.kill`.
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        '201':
          description: Killed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  status: { type: string, example: ended }
                  codes_voided: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/campaigns/{id}/adjust:
    post:
      tags: [Admin]
      summary: Manually adjust a campaign's budget (goodwill credit or clawback)
      description: |
        Goes through the same double-entry ledger as normal funding. Can never push a balance
        below zero. Audited as `campaign.adjust`.
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coins]
              properties:
                coins: { type: integer, description: 'Non-zero, within ±10,000,000. Negative = clawback.' }
                reason: { type: string }
      responses:
        '201':
          description: New budget
          content:
            application/json:
              schema:
                type: object
                properties: { budget: { type: integer }, reason: { type: string, nullable: true } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/qr-codes/{id}:
    patch:
      tags: [Admin]
      summary: Override a QR code's expiry, use limit, or void state
      description: |
        The only way to loosen a code (extend expiry, raise/remove use limit, un-void) —
        promoters may only tighten their own codes. Audited as `qr_code.override`.
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_at: { type: string, format: date-time, nullable: true, description: 'null clears the expiry' }
                max_uses: { type: integer, nullable: true, description: 'null clears the limit' }
                voided: { type: boolean }
                reason: { type: string }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/QrCode' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/qr-codes:
    get:
      tags: [Admin]
      summary: List every QR code across all tenants
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/QrCode' } }

  /v1/admin/audit-log:
    get:
      tags: [Admin]
      summary: Every admin override — who, what, why, when
      security: [{ sessionAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 200, maximum: 1000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }

  /v1/admin/scans:
    get:
      tags: [Admin]
      summary: Scan-level data across all tenants
      security: [{ sessionAuth: [] }]
      parameters:
        - name: campaign_id
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, default: 200, maximum: 1000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminScan' } }

  /v1/admin/redemptions:
    get:
      tags: [Admin]
      summary: Every redemption across all tenants
      security: [{ sessionAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 200, maximum: 1000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Redemption' } }

  /v1/admin/ledger:
    get:
      tags: [Admin]
      summary: Raw ledger entries and current account balances
      security: [{ sessionAuth: [] }]
      parameters:
        - name: account
          in: query
          description: 'Filter to one account, e.g. campaign:{id} or publisher:{org_id}'
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } }
                  balances:
                    type: array
                    items:
                      type: object
                      properties:
                        account: { type: string }
                        balance: { type: integer }

components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 12h session token from `/v1/auth/signup` or `/v1/auth/login`
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: 'pk_<hex>'
      description: Publisher's Partner API key — server-to-server only

  responses:
    BadRequest:
      description: Validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing/invalid credentials, or account suspended
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated, but not allowed to perform this action
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found (or not owned by the caller — ownership failures read as 404, not 403)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      properties:
        statusCode: { type: integer }
        message: { type: string }
        error: { type: string }

    OrgSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [promoter, publisher, admin] }

    Org:
      allOf:
        - { $ref: '#/components/schemas/OrgSummary' }
        - type: object
          properties:
            email: { type: string, format: email }
            landing_url: { type: string, nullable: true }
            suspended: { type: boolean }

    AdminOrg:
      allOf:
        - { $ref: '#/components/schemas/Org' }
        - type: object
          properties:
            created_at: { type: string, format: date-time }
            has_api_key: { type: boolean }
            campaigns: { type: integer }
            coin_balance: { type: integer, nullable: true, description: 'Publishers only' }

    Partnership:
      type: object
      properties:
        id: { type: string, format: uuid }
        promoter_org_id: { type: string, format: uuid }
        publisher_org_id: { type: string, format: uuid }
        promoter_name: { type: string }
        publisher_name: { type: string }
        coin_rate: { type: integer }
        guest_rate: { type: integer }
        grace_days: { type: integer }
        status: { type: string, enum: [pending, active] }
        created_at: { type: string, format: date-time }

    Campaign:
      type: object
      properties:
        id: { type: string, format: uuid }
        partnership_id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, paused, ended] }
        coin_rate: { type: integer }
        promoter_name: { type: string }
        publisher_name: { type: string }
        budget: { type: integer }
        created_at: { type: string, format: date-time }

    QrStyle:
      type: object
      description: Colors, size, quiet zone, error correction, optional center logo
      properties:
        fgColor: { type: string }
        bgColor: { type: string }
        size: { type: integer }
        margin: { type: integer }
        errorCorrectionLevel: { type: string, enum: [L, M, Q, H] }
        logo: { type: string, nullable: true, description: Data URL }

    QrCode:
      type: object
      properties:
        id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid }
        code: { type: string }
        scan_url: { type: string }
        style: { $ref: '#/components/schemas/QrStyle' }
        expires_at: { type: string, format: date-time, nullable: true }
        max_uses: { type: integer, nullable: true }
        uses: { type: integer }
        voided: { type: boolean }
        created_at: { type: string, format: date-time }

    Redemption:
      type: object
      properties:
        id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid }
        campaign_name: { type: string }
        scan_id: { type: string, format: uuid }
        publisher_user_ref: { type: string }
        coins: { type: integer }
        identified: { type: boolean }
        upgraded_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    AdminScan:
      type: object
      properties:
        id: { type: string, format: uuid }
        scanned_at: { type: string, format: date-time }
        ip_hash: { type: string }
        user_agent: { type: string }
        consumed: { type: boolean }
        qr_code: { type: string }
        campaign_id: { type: string, format: uuid }
        campaign_name: { type: string }
        promoter_name: { type: string }
        publisher_name: { type: string }
        redeemed: { type: boolean }
        coins: { type: integer, nullable: true }

    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        actor_org_id: { type: string, format: uuid }
        actor_name: { type: string, nullable: true }
        actor_email: { type: string, nullable: true }
        action: { type: string }
        target: { type: string }
        meta: { type: object, nullable: true }
        created_at: { type: string, format: date-time }

    LedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        account: { type: string }
        amount: { type: integer }
        ref: { type: string }
        created_at: { type: string, format: date-time }
