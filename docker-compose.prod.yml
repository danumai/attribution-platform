# Whole stack, production mode. Reads secrets from the shell environment — nothing
# sensitive is committed here.
#
#   export JWT_SECRET=$(openssl rand -hex 32)
#   export ADMIN_EMAIL=you@example.com ADMIN_PASSWORD='...12+ chars...'
#   export POSTGRES_PASSWORD=$(openssl rand -hex 16)
#   export BASE_URL=https://api.example.com FRONTEND_URL=https://app.example.com
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Both services expect to sit behind a TLS-terminating proxy: the app refuses to boot with
# http:// URLs in production because scan tokens travel over those origins in the clear.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qrreward
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: qrreward
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qrreward']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://qrreward:${POSTGRES_PASSWORD}@db:5432/qrreward
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      BASE_URL: ${BASE_URL:?set BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      # the reverse proxy in front of this container sets X-Forwarded-For
      TRUST_PROXY: '1'
      # Shared rate-limit counters. Required before scaling `api` past one replica: the per-IP
      # limits are security controls counted per process, so two instances without this is
      # two times every limit. Optional at one replica, which is what this file describes.
      REDIS_URL: ${REDIS_URL:-}
      # Set to serve GET /metrics; absent, the endpoint 404s.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # HMAC secret shared with the payment provider's webhook adapter. Absent, money-in is
      # off: POST /v1/payments/webhook answers 404.
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      # Slack-compatible URL for operational alerts (ledger drift, budgets running dry).
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # The platform's take rate in basis points (1000 = 10%), snapshotted per partnership.
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-1000}
      # Days earned fees stay unwithdrawable — the fraud-review clawback window.
      SETTLEMENT_DELAY_DAYS: ${SETTLEMENT_DELAY_DAYS:-14}
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Nightly logical backup of the one thing that cannot be re-derived: the ledger. Keeps 14
  # days locally; ship the volume off-host (object storage, rsync) for real durability.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dbbackups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -h db -U qrreward qrreward | gzip > "/backups/qrreward-$$(date +%Y%m%d-%H%M%S).sql.gz" \
            && echo "backup written" || echo "BACKUP FAILED" >&2
          ls -1t /backups/qrreward-*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm --
          sleep 86400
        done

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${BASE_URL:?set BASE_URL}
    restart: unless-stopped
    depends_on: [api]
    environment:
      NODE_ENV: production
      API_URL: http://api:4000 # server-side calls skip the public internet
    ports:
      - '3000:3000'

volumes:
  dbdata:
  dbbackups:
