services:
  db:
    image: postgres:16-alpine
    container_name: qrreward-db
    environment:
      POSTGRES_USER: qrreward
      POSTGRES_PASSWORD: qrreward
      POSTGRES_DB: qrreward
    ports:
      - '5436:5432'
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qrreward']
      interval: 5s
      timeout: 3s
      retries: 10

  # Shared rate-limit counter store — .env sets REDIS_URL to this. Without it every
  # rate-limit check on the scan hot path warns and falls back to the in-process window.
  redis:
    image: redis:7-alpine
    container_name: qrreward-redis
    ports:
      # 6380 on the host, like the db's 5436: this machine runs several stacks and the
      # default port is routinely already taken. REDIS_URL in .env must agree.
      - '6380:6379'

volumes:
  dbdata:
