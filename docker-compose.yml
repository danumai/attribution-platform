services:
  db:
    image: postgres:16-alpine
    container_name: qrreward-db
    environment:
      POSTGRES_USER: qrreward
      POSTGRES_PASSWORD: qrreward
      POSTGRES_DB: qrreward
    ports:
      - '5436:5432'
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qrreward']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
